name: Web CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://whisperledger-api.onrender.com/api/v1' }}

      - name: Verify Container Build (Cloud Run / Docker Ready)
        run: docker build -t whisperledger-web:test .
